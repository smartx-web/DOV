<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>DOV Registration</title><style>body{margin:0;background:#f6f4f4;font:16px system-ui;color:#222}header{background:#8f1928;color:white;padding:32px 20px}main{max-width:700px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:16px 0;font-weight:600}input,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font:inherit}.check input{width:auto;display:inline}button{background:#8f1928;color:white;border:0;padding:14px;width:100%;border-radius:8px;font-weight:bold}@media(max-width:750px){main{margin:12px;padding:18px}}</style></head><body><header><h1>David Olofu Volunteer Portal</h1>Benue South • Polling Agent Volunteer Registration</header><main><p>Expression of interest only. Registration does not constitute INEC accreditation.</p><p id="availability" role="status">Checking registration availability…</p><form id="f" hidden><label>Full name<input name="full_name" required minlength="3"></label><label>Phone<input name="phone" required minlength="10"></label><label>Email<input name="email" type="email"></label><label>Community<input name="community"></label><p>State: Benue • District: Benue South</p><label>LGA<select id="lga" required></select></label><label>Ward<select id="ward" required disabled></select></label><label>Polling unit<select id="pu" required disabled></select></label><label class="check"><input type="checkbox" name="over_18" required> I am 18 or older</label><label class="check"><input type="checkbox" name="election_day_available" required> Available election day</label><label class="check"><input type="checkbox" name="training_available" required> Available for training</label><label class="check"><input type="checkbox" name="previous_experience"> Previous polling agent experience</label><label class="check"><input type="checkbox" name="smartphone_access"> Smartphone with internet</label><label>Preferred contact<select name="contact_method"><option>WhatsApp</option><option>SMS</option><option>Call</option></select></label><label class="check"><input type="checkbox" name="consent" required> I consent to authorized organizers processing my information for volunteer coordination.</label><button>Submit application</button></form><p id="message" role="status"></p><a href="/admin">Administrator</a></main><script>
const f=document.querySelector('#f'),lga=document.querySelector('#lga'),ward=document.querySelector('#ward'),pu=document.querySelector('#pu'),msg=document.querySelector('#message');
async function load(url,select){select.disabled=true;select.replaceChildren(new Option('Choose option',''));const r=await fetch(url);if(!r.ok)throw Error('Directory unavailable');for(const x of await r.json())select.add(new Option(x.name,x.id));select.disabled=false}
fetch('/api/config').then(r=>{if(!r.ok)throw Error('Service unavailable');return r.json()}).then(x=>{const enabled=x.registration_enabled===true;document.querySelector('#availability').textContent=enabled?'Registration is open.':'Registration is not open yet.';f.hidden=!enabled;if(enabled)return load('/api/lgas',lga)}).catch(e=>{document.querySelector('#availability').textContent='Registration is unavailable.';msg.textContent=e.message});
lga.onchange=async()=>{ward.disabled=true;pu.disabled=true;ward.replaceChildren();pu.replaceChildren();if(lga.value)try{await load('/api/wards?lga_id='+lga.value,ward)}catch(e){msg.textContent=e.message}};
ward.onchange=async()=>{pu.disabled=true;pu.replaceChildren();if(ward.value)try{await load('/api/polling-units?ward_id='+ward.value,pu)}catch(e){msg.textContent=e.message}};
f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),v={};for(const k of ['full_name','phone','email','community','contact_method'])v[k]=d.get(k);for(const k of ['over_18','election_day_available','training_available','previous_experience','smartphone_access','consent'])v[k]=d.has(k);v.polling_unit_id=Number(pu.value);try{const r=await fetch('/api/volunteers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}),j=await r.json();if(!r.ok)throw Error(j.error);msg.textContent='Registration received. Reference '+j.reference;f.reset()}catch(e){msg.textContent=e.message}};
</script></body></html>
