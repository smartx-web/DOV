<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOV Admin</title></head><body style="font:16px system-ui;max-width:900px;margin:30px auto;padding:20px"><h1>DOV Administrator</h1><p>Local testing only. HTTP Basic authentication is not suitable for public launch without HTTPS and additional safeguards.</p><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button id="load">Load volunteers</button><p id="msg"></p><div id="items"></div><script>
document.querySelector('#load').onclick=async()=>{const email=document.querySelector('#email').value,pass=document.querySelector('#pass').value,auth='Basic '+btoa(email+':'+pass),msg=document.querySelector('#msg'),items=document.querySelector('#items');items.replaceChildren();try{const r=await fetch('/api/admin/volunteers',{headers:{Authorization:auth}}),data=await r.json();if(!r.ok)throw Error(data.error);msg.textContent=data.length+' registrations';for(const v of data){const div=document.createElement('div'),p=document.createElement('p'),s=document.createElement('select');p.textContent=v.name+' • '+v.phone+' • '+v.lga+' / '+v.ward+' / '+v.pu;div.append(p);for(const x of ['pending','screened','approved','rejected','trained','deployed'])s.add(new Option(x,x));s.value=v.status;s.onchange=async()=>{const r=await fetch('/api/admin/volunteers/'+v.id+'/status',{method:'PATCH',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});msg.textContent=r.ok?'Status updated':'Update failed'};div.append(s);items.append(div)}}catch(e){msg.textContent=e.message}};
</script></body></html>
