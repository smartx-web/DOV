services:
  - type: web
    name: dov-portal
    runtime: docker
    repo: https://github.com/smartx-web/DOV
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REGISTRATION_ENABLED
        value: "false"
